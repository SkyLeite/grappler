[package]
name = "grappler-macros"
version = "0.1.10"
description = "Macros of the `grappler` crate."
license.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
Inflector = "0.11.4"
darling = "0.20.9"
proc-macro2 = "1.0.86"
quote = "1.0.36"
syn = { version = "2.0.66", features = ["full"] }
